<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="inter.js" defer></script>
    <title>embed media player | bloxxer.dev</title>
</head>
<body>
    <h2>Bloxxer.dev Interactive</h2>

    <div id="Numarray">
        <button id="1" class="Correct" txt="Correct. 17 is an Int!">17</button>
        <button id="2" class="Incorrect" txt="Watch out! 12.8 is not an int.">12.8</button>
        <button id="3" class="Incorrect" txt="Wrong - 6.84 has a floating (decimal) point">6.84</button>
        <button id="4" class="Correct" txt="Yay! 28 is an integer">28</button>
        <button id="5" class="Incorrect" txt="Wront - 48.07 still has a floating point!">48.07</button>
        <button id="6" class="Incorrect" txt="Nope! ANY number in python with a floating point is a float, even if it is just 0">96.0</button>
        <button id="7" class="Correct" txt="Well done, 4 is an int">4</button>
        <button id="8" class="Correct" txt="Yes, 936 is an integer.">936</button>
    </div>
    <h3 id="Response">Click the numbers you think are integers!</h3>
    <p><span id="Left">4</span> unclicked integers</p>
</body>
</html>
